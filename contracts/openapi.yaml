        - riskType
        - riskZone
        - riskGroup
        - owner
        - relatedActivity
        - preparedByUnit
        - description
        - inherent
      properties:
        hsrrCode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 500
        riskType:
          type: string
          maxLength: 255
        riskZone:
          type: string
          maxLength: 255
        riskGroup:
          type: string
          maxLength: 255
        owner:
          type: string
          maxLength: 255
        relatedActivity:
          type: string
          maxLength: 1000
        preparedByUnit:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        inherent:
          $ref: '#/components/schemas/RatingInput'
    CauseInput:
      type: object
      additionalProperties: false
      required:
        - group
        - description
      properties:
