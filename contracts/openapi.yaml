        - level
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 10000
        level:
          type: string
          description: Nhãn thuộc thang Ảnh hưởng
    ControlInput:
      type: object
      additionalProperties: false
      required:
        - description
        - ownerText
        - frequency
        - objective
        - method
        - designEff
        - operatingEff
        - overallEff
        - needsSupplement
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 10000
        ownerText:
          type: string
          maxLength: 1000
        frequency:
          type: string
          maxLength: 100
        objective:
          type: string
          maxLength: 100
        method:
          type: string
          maxLength: 100
        designEff:
          type: string
          maxLength: 100
        operatingEff:
          type: string
          maxLength: 100
        overallEff:
          type: string
          maxLength: 100
        needsSupplement:
          type: boolean
    ActionInput:
      type: object
      additionalProperties: false
      required:
        - description
        - responsibilityText
        - deliverable
        - dueText
