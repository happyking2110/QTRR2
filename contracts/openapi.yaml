          maxLength: 10000
        responsibilityText:
          type: string
          maxLength: 2000
        deliverable:
          type: string
          maxLength: 2000
        dueText:
          type: string
          maxLength: 500
          description: Văn bản hạn nguyên văn; server tính dueDate bằng parseDue, không nhận dueDate từ client
    IndicatorInput:
      type: object
      additionalProperties: false
      required:
        - name
        - formula
        - frequency
        - thresholds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1000
        formula:
          type: string
          maxLength: 2000
        frequency:
          type: string
          enum:
            - Tháng
            - Quý
            - Hàng quý
            - Theo đợt diễn tập
          description: Đúng bảng backend-design 7.1.1; server suy ra periodKind
        thresholds:
          $ref: '#/components/schemas/IndicatorThresholds'
        note:
          type: [ string, 'null' ]
          maxLength: 1000
    LinkCodesRequest:
      type: object
      additionalProperties: false
      required:
        - codes
      properties:
        codes:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.(NN|KS)[0-9]{2,3}$'
    TaskInput:
      type: object
      additionalProperties: false
      required:
        - name
        - unitCode
        - dueDate
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        unitCode:
          type: [ string, 'null' ]
          pattern: '^[A-Z0-9_]+$'
        dueDate:
          type: [ string, 'null' ]
          format: date
    SplitTaskRequest:
      type: object
      additionalProperties: false
      required:
        - parts
      properties:
        parts:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: '#/components/schemas/TaskInput'
    ImportIssue:
      type: object
      additionalProperties: false
      required:
        - level
        - code
        - message
        - ref
      properties:
        level:
          type: string
          enum:
            - error
            - warning
        code:
          type: string
          enum:
            - LINK_ONE_SIDED
            - MANUAL_ZONE
            - NO_DUE_DATE
            - SKIPPED_EDITED
            - SKIPPED_DELETED
            - BAD_REFERENCE
            - DUPLICATE_CODE
            - BAD_PREFIX
            - MISSING_CODE
            - UNKNOWN_SCALE_LABEL
            - UNKNOWN_FREQUENCY
            - EMPTY_SECTION
          description: Mã loại vấn đề (backend-design 4.12 mục 15)
        message:
          type: string
        ref:
          type: [ string, 'null' ]
          description: Mã hồ sơ hoặc mã mục liên quan
    ImportCycleReport:
      type: object
      additionalProperties: false
      required:
        - year
        - counts
        - issues
      properties:
        year:
          type: integer
        counts:
          type: object
          additionalProperties: false
          required:
            - profiles
            - causes
            - impacts
            - controls
            - actions
            - tasksCreated
            - kri
            - kci
            - periodsCreated
          properties:
            profiles:
              type: integer
            causes:
              type: integer
            impacts:
              type: integer
            controls:
              type: integer
            actions:
              type: integer
            tasksCreated:
              type: integer
            kri:
              type: integer
            kci:
              type: integer
            periodsCreated:
              type: integer
        issues:
          type: array
          description: Chỉ cảnh báo (lỗi chặn thì trả 422 IMPORT_INVALID với details là ImportIssue[])
          items:
            $ref: '#/components/schemas/ImportIssue'
    CloneCycleRequest:
      type: object
      additionalProperties: false
      required:
        - fromYear
      properties:
        fromYear:
          type: integer
          minimum: 2000
          maximum: 2100

    CreateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - riskCode
        - hsrrCode
        - name
        - riskType
        - riskZone
        - riskGroup
        - owner
        - relatedActivity
        - preparedByUnit
        - description
        - inherent
      properties:
        riskCode:
          type: string
          pattern: '^[A-Z0-9]+\.[A-Z0-9]+$'
        hsrrCode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 500
        riskType:
          type: string
          maxLength: 255
        riskZone:
          type: string
          maxLength: 255
        riskGroup:
          type: string
          maxLength: 255
        owner:
          type: string
          maxLength: 255
        relatedActivity:
          type: string
          maxLength: 1000
        preparedByUnit:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        inherent:
          $ref: '#/components/schemas/RatingInput'
    CreateCauseRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - group
        - description
      properties:
        code:
          type: string
          description: Mã đầy đủ đã chuẩn hóa, bắt đầu bằng riskCode của hồ sơ, ví dụ HD11.R27.NN06
          pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.(NN|AH|KS|KH|KRI|KCI)[0-9]{2,3}$'
        group:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 10000
    CreateImpactRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - group
        - description
        - level
      properties:
        code:
          type: string
          description: Mã đầy đủ đã chuẩn hóa, bắt đầu bằng riskCode của hồ sơ, ví dụ HD11.R27.NN06
          pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.(NN|AH|KS|KH|KRI|KCI)[0-9]{2,3}$'
        group:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 10000
        level:
          type: string
          description: Nhãn thuộc thang Ảnh hưởng
    CreateControlRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - ownerText
        - frequency
        - objective
        - method
        - designEff
        - operatingEff
        - overallEff
        - needsSupplement
      properties:
        code:
          type: string
          description: Mã đầy đủ đã chuẩn hóa, bắt đầu bằng riskCode của hồ sơ, ví dụ HD11.R27.NN06
          pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.(NN|AH|KS|KH|KRI|KCI)[0-9]{2,3}$'
        description:
          type: string
          minLength: 1
          maxLength: 10000
        ownerText:
          type: string
          maxLength: 1000
        frequency:
          type: string
          maxLength: 100
        objective:
          type: string
          maxLength: 100
        method:
          type: string
          maxLength: 100
        designEff:
          type: string
          maxLength: 100
        operatingEff:
          type: string
          maxLength: 100
        overallEff:
          type: string
          maxLength: 100
        needsSupplement:
          type: boolean
    CreateActionRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - responsibilityText
        - deliverable
        - dueText
      properties:
        code:
          type: string
          description: Mã đầy đủ đã chuẩn hóa, bắt đầu bằng riskCode của hồ sơ, ví dụ HD11.R27.NN06
          pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.(NN|AH|KS|KH|KRI|KCI)[0-9]{2,3}$'
        description:
          type: string
          minLength: 1
          maxLength: 10000
        responsibilityText:
          type: string
          maxLength: 2000
        deliverable:
          type: string
          maxLength: 2000
        dueText:
          type: string
          maxLength: 500
          description: Văn bản hạn nguyên văn; server tính dueDate bằng parseDue, không nhận dueDate từ client
    CreateIndicatorRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - formula
        - frequency
        - thresholds
      properties:
        code:
          type: string
          description: Mã đầy đủ đã chuẩn hóa, bắt đầu bằng riskCode của hồ sơ, ví dụ HD11.R27.NN06
          pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.(NN|AH|KS|KH|KRI|KCI)[0-9]{2,3}$'
        name:
          type: string
          minLength: 1
          maxLength: 1000
        formula:
          type: string
          maxLength: 2000
        frequency:
          type: string
          enum:
            - Tháng
            - Quý
            - Hàng quý
            - Theo đợt diễn tập
          description: Đúng bảng backend-design 7.1.1; server suy ra periodKind
        thresholds:
          $ref: '#/components/schemas/IndicatorThresholds'
        note:
          type: [ string, 'null' ]
          maxLength: 1000
    IndicatorTargetsInput:
      type: object
      additionalProperties: false
      required:
        - unitKind
        - unitLabel
        - direction
        - yellowAt
        - redAt
        - targetValue
      description: "Ngưỡng số, đơn vị, chiều và mục tiêu do admin thiết lập (4C). yellowAt và redAt cùng có hoặc cùng null; khi có thì đúng thứ tự theo direction (higher_is_worse: yellowAt < redAt; lower_is_worse: yellowAt > redAt) và direction bắt buộc khác null. percent: mọi số trong 0 đến 100. targetValue chỉ cho KCI (KRI gửi null). Sai thì 422."
      properties:
        unitKind:
          type: string
          enum:
            - percent
            - count
        unitLabel:
          type: string
          minLength: 1
          maxLength: 20
        direction:
          type:
            - string
            - "null"
          enum:
            - higher_is_worse
            - lower_is_worse
            - null
        yellowAt:
          type:
            - number
            - "null"
          minimum: 0
        redAt:
          type:
            - number
            - "null"
          minimum: 0
        targetValue:
          type:
            - number
            - "null"
          minimum: 0
paths:
  /api/health:
    get:
      security: []
      x-roles: []
      summary: Kiểm tra trạng thái hoạt động của hệ thống và cơ sở dữ liệu
      responses:
        '200':
          description: Hệ thống và cơ sở dữ liệu hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dịch vụ hoặc cơ sở dữ liệu chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/cycles:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Danh sách chu kỳ, năm lớn trước
      responses:
        '200':
          description: Danh sách chu kỳ (mảng rỗng nếu chưa có chu kỳ nào)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CycleSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/cycles/{year}/periods:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Danh sách kỳ của một chu kỳ, kỳ cũ trước
      parameters:
        - $ref: '#/components/parameters/YearPath'
      responses:
        '200':
          description: Danh sách kỳ (mảng rỗng nếu chu kỳ chưa có kỳ nào)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/units:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Danh sách đơn vị (có thể rỗng ở kế hoạch 2)
      responses:
        '200':
          description: Danh sách đơn vị theo mã
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnitSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/profiles:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Danh sách hồ sơ rủi ro của chu kỳ (tóm tắt)
      parameters:
        - $ref: '#/components/parameters/CycleParam'
        - $ref: '#/components/parameters/PeriodParam'
      responses:
        '200':
          description: Hồ sơ chưa xóa, sắp theo mã hồ sơ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Tạo hồ sơ rủi ro trong chu kỳ
      x-roles: [ admin, ban4 ]
      parameters:
        - $ref: '#/components/parameters/CycleParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Hồ sơ vừa tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/profiles/{riskCode}:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Chi tiết một hồ sơ (nhận diện, nguyên nhân, ảnh hưởng, kiểm soát, kế hoạch hành động, chỉ số)
      parameters:
        - $ref: '#/components/parameters/RiskCodePath'
        - $ref: '#/components/parameters/CycleParam'
        - $ref: '#/components/parameters/PeriodParam'
      responses:
        '200':
          description: Hồ sơ đầy đủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Sửa thông tin hồ sơ (mã không đổi)
      x-roles: [ admin, ban4 ]
      parameters:
        - $ref: '#/components/parameters/RiskCodePath'
        - $ref: '#/components/parameters/CycleParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Hồ sơ sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Xóa mềm hồ sơ và mọi mục con (từ chối REFERENCED nếu đã có số liệu, tiến độ hoặc mức còn lại)
      x-roles: [ admin, ban4 ]
      parameters:
        - $ref: '#/components/parameters/RiskCodePath'
        - $ref: '#/components/parameters/CycleParam'
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/overview:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Số liệu tổng quan của dashboard (chỉ tính bản đã duyệt)
      parameters:
        - $ref: '#/components/parameters/CycleParam'
        - $ref: '#/components/parameters/PeriodParam'
      responses:
        '200':
          description: Thẻ tổng quan. Chưa có số liệu đã duyệt thì hasApprovedData là false, các chỉ số đếm vào noData.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/heatmap:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Vị trí các hồ sơ trên ma trận nhiệt 5x5 (mức tiềm ẩn và mức còn lại)
      parameters:
        - $ref: '#/components/parameters/CycleParam'
        - $ref: '#/components/parameters/PeriodParam'
      responses:
        '200':
          description: Thang 5 mức và vị trí từng hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heatmap'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/actions:
    get:
      x-roles: [ admin, ban4, unit, viewer ]
      summary: Danh sách kế hoạch hành động kèm đầu việc
      parameters:
        - $ref: '#/components/parameters/CycleParam'
        - $ref: '#/components/parameters/PeriodParam'
        - name: riskCode
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActionStatus'
        - name: unit
          in: query
          required: false
          description: Mã đơn vị; lọc KH có ít nhất một đầu việc thuộc đơn vị đó
          schema:
            type: string
        - name: dueFrom
          in: query
          required: false
          description: Hạn của KH từ ngày này (gồm). KH không có hạn bị loại khi có tham số này.
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          required: false
          description: Hạn của KH đến ngày này (gồm). KH không có hạn bị loại khi có tham số này.
          schema:
            type: string
            format: date
        - name: q
          in: query
          required: false
          description: Tìm theo mã hoặc từ khóa trong mô tả, không phân biệt hoa thường
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Danh sách KH sắp theo hạn tăng dần, KH không có hạn xếp cuối
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionListItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
