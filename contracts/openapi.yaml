openapi: 3.1.0
info:
  title: MBF Risk Monitor API
  version: 0.6.0
  description: |
    Hợp đồng REST API giữa backend (apps/api) và frontend (apps/web) của MBF Risk Monitor.
    Đây là nguồn sự thật: không thêm, bớt hay đổi endpoint, trường, mã lỗi ngoài văn bản này mà không hỏi PM.

    Phạm vi hiện tại: kế hoạch 2 (dashboard chỉ xem), kế hoạch 3A (đăng nhập, người dùng, đơn vị, gán đơn vị),
    kế hoạch 3B (nộp số liệu, duyệt, kỳ, rủi ro còn lại, cấu hình, nhật ký), kế hoạch 4A (thêm/sửa/xóa hồ sơ
    và mục con, đầu việc, tách đầu việc, import/nhân bản/lưu trữ chu kỳ, xuất BM06 và tổng quan) và kế hoạch 4C
    (đơn vị, chiều, ngưỡng số và mục tiêu KCI do admin thiết lập; điểm mức rủi ro).
    Từ kế hoạch 3A mọi endpoint trừ `GET /api/health` và `POST /api/auth/login` **bắt buộc phiên** (cookie
    `hsrr_session`); thiếu hoặc hết hạn phiên trả 401 `UNAUTHENTICATED`. Khi `mustChangePassword` đang bật, mọi
    endpoint trừ `POST /api/auth/change-password`, `POST /api/auth/logout` và `GET /api/auth/me` trả 403
    `MUST_CHANGE_PASSWORD`. Request thay đổi dữ liệu (POST, PUT, PATCH, DELETE) bắt buộc có `Origin` khớp `APP_ORIGIN`,
    sai thì trả 403 `FORBIDDEN`. Mỗi thao tác có `x-roles`: các vai trò được gọi (admin, ban4, unit, viewer); vai trò khác
    nhận 403 `FORBIDDEN`.
    Quyền theo từng mục (đơn vị nào nộp được mục nào) do API trả qua `submitPeriodKeys`, `canWithdraw`, `canApprove`;
    frontend không tự suy ra.

    Quy ước: tên trường camelCase; ngày `YYYY-MM-DD`; thời điểm ISO 8601 UTC; mã (riskCode, code) ở dạng
    chuẩn hóa; mọi giá trị đã tính (vùng, tiến độ, trạng thái, tọa độ ma trận) do API trả về,
    frontend không tự tính. Giá trị có thể null viết `type: [..., "null"]` (OpenAPI 3.1).
servers:
  - url: /
security:
  - hsrr_session: []
components:
  securitySchemes:
    hsrr_session:
      type: apiKey
      in: cookie
      name: hsrr_session
      description: Cookie phiên làm việc, do POST /api/auth/login đặt (httpOnly, SameSite=Lax; có Secure khi APP_ORIGIN là https)
  parameters:
    CycleParam:
      name: cycle
      in: query
      required: false
      description: Năm của chu kỳ. Không có thì dùng chu kỳ đang mở (trạng thái open) có năm lớn nhất.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    PeriodParam:
      name: period
      in: query
      required: false
      description: |
        Khóa kỳ, ví dụ `2026-Q4` hoặc `2026-10`. Không có thì dùng kỳ gần nhất có số liệu đã duyệt;
        chưa có số liệu đã duyệt thì dùng kỳ quý chứa ngày hiện tại nếu kỳ đó tồn tại; nếu không có kỳ nào
        thì `period` trong đáp ứng là null. Khóa kỳ không tồn tại trong chu kỳ trả 404 PERIOD_NOT_FOUND.
      schema:
        type: string
        pattern: '^[0-9]{4}-(Q[1-4]|[0-9]{2}|E[0-9]+)$'
    RiskCodePath:
      name: riskCode
      in: path
      required: true
      description: Mã hồ sơ đã chuẩn hóa, ví dụ `HD11.R27`
      schema:
        type: string
        pattern: '^[A-Z0-9]+\.[A-Z0-9]+$'
    YearPath:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    IndicatorIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskIdPath:
      name: id
      in: path
      required: true
      description: Mã định danh đầu việc (ActionTask.id)
      schema:
        type: string
        format: uuid
    UnitCodePath:
      name: code
      in: path
      required: true
      description: Mã đơn vị, ví dụ `TT1`, `BAN4`, `MBF_TINH_TP`
      schema:
        type: string
        pattern: '^[A-Z0-9_]+$'
        maxLength: 50
    ItemCodePath:
      name: code
      in: path
      required: true
      description: Mã kiểm soát hoặc mã chỉ số đã chuẩn hóa, ví dụ `HD11.R27.KS01`, `HD11.R27.KRI01`
      schema:
        type: string
        pattern: '^[A-Z0-9]+\.[A-Z0-9]+\.[A-Z]+[0-9]+$'
    PeriodKeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{4}-(Q[1-4]|[0-9]{2}|E[0-9]+)$'
    QuarterKeyPath:
      name: periodKey
      in: path
      required: true
      description: Khóa kỳ quý, ví dụ `2026-Q4`
      schema:
        type: string
        pattern: '^[0-9]{4}-Q[1-4]$'
    SubmissionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportPeriodParam:
      name: period
      in: query
      required: false
      description: Khóa kỳ để lấy số liệu đã duyệt đến cuối kỳ đó; không có thì theo quy tắc của PeriodParam
      schema:
        type: string
        pattern: '^[0-9]{4}-(Q[1-4]|[0-9]{2}|E[0-9]+)$'
  responses:
    Unauthenticated:
      description: Chưa đăng nhập hoặc phiên hết hạn (UNAUTHENTICATED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Không đủ quyền, sai Origin hoặc phải đổi mật khẩu trước (FORBIDDEN hoặc MUST_CHANGE_PASSWORD)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Trùng khóa duy nhất hoặc trạng thái không cho phép (CONFLICT hoặc INVALID_STATE hoặc CYCLE_ARCHIVED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Không tìm thấy chu kỳ, hồ sơ, chỉ số hoặc kỳ được yêu cầu (NOT_FOUND hoặc PERIOD_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Tham số truy vấn hoặc đường dẫn không hợp lệ (VALIDATION)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServerError:
      description: Lỗi hệ thống không dự kiến (INTERNAL), không kèm chi tiết
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - MUST_CHANGE_PASSWORD
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - VALIDATION
        - NOT_FOUND
        - CONFLICT
        - REFERENCED
        - PERIOD_NOT_FOUND
        - PERIOD_CLOSED
        - CYCLE_ARCHIVED
        - INVALID_STATE
        - SELF_APPROVAL
        - IMPORT_INVALID
        - INTERNAL
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        details: {}
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Zone:
      type: string
      description: Vùng chỉ số. green là cột Thấp trong Excel, yellow là Trung bình, red là Cao.
      enum:
        - green
        - yellow
        - red
    ActionStatus:
      type: string
      description: Trạng thái kế hoạch hành động, tính ở server (backend-design 6.7)
      enum:
        - completed
        - overdue
        - at_risk
        - in_progress
        - not_started
    CycleSummary:
      type: object
      additionalProperties: false
      required:
        - year
        - status
      properties:
        year:
          type: integer
        status:
          type: string
          enum:
            - open
            - archived
    PeriodSummary:
      type: object
      additionalProperties: false
      required:
        - key
        - kind
        - label
        - startsOn
        - endsOn
        - dueAt
        - closed
        - closedAt
        - closedByName
        - reopenReason
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
            - month
            - quarter
            - event
        label:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        dueAt:
          type: string
          format: date-time
        closed:
          type: boolean
        closedAt:
          type: [ string, 'null' ]
          format: date-time
        closedByName:
          type: [ string, 'null' ]
          description: Họ tên người khóa kỳ; null khi kỳ đang mở
        reopenReason:
          type: [ string, 'null' ]
          description: Lý do mở lại gần nhất; null nếu chưa từng mở lại
    UnitSummary:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - kind
      properties:
        code:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - department
            - center
            - group
    RiskRating:
      type: object
      description: Mức rủi ro. Nhãn lấy nguyên từ Excel; điểm 1 đến 5 theo thang tạm (giả định G1).
      additionalProperties: false
      required:
        - impactLabel
        - likelihoodLabel
        - levelLabel
        - impactScore
        - likelihoodScore
        - score
      properties:
        impactLabel:
          type: string
        likelihoodLabel:
          type: string
        levelLabel:
          type: string
        impactScore:
          type: integer
          minimum: 1
          maximum: 5
        likelihoodScore:
          type: integer
          minimum: 1
          maximum: 5
        score:
          type: integer
          minimum: 1
          maximum: 25
          description: likelihoodScore × impactScore theo thang tạm G1, do server tính. Nhãn mức (levelLabel) vẫn lấy nguyên văn, không suy từ điểm.
    IndicatorZoneCounts:
      type: object
      description: Số chỉ số theo vùng của giá trị hiện hành. noData là chỉ số chưa có bản đã duyệt.
      additionalProperties: false
      required:
        - total
        - green
        - yellow
        - red
        - noData
      properties:
        total:
          type: integer
          minimum: 0
        green:
          type: integer
          minimum: 0
        yellow:
          type: integer
          minimum: 0
        red:
          type: integer
          minimum: 0
        noData:
          type: integer
          minimum: 0
    ActionStatusCounts:
      type: object
      additionalProperties: false
      required:
        - total
        - completed
        - overdue
        - atRisk
        - inProgress
        - notStarted
      properties:
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
        atRisk:
          type: integer
          minimum: 0
        inProgress:
          type: integer
          minimum: 0
        notStarted:
          type: integer
          minimum: 0
    CurrentReading:
      type: object
      description: Bản ghi đã duyệt mới nhất của kỳ gần nhất có bản duyệt (backend-design 6.9)
      additionalProperties: false
      required:
        - periodKey
        - valueNum
        - valueText
        - zone
        - zoneSource
        - reviewedAt
      properties:
        periodKey:
          type: string
        valueNum:
          type: [ number, 'null' ]
        valueText:
          type: [ string, 'null' ]
        zone:
          $ref: '#/components/schemas/Zone'
        zoneSource:
          type: string
          enum:
            - auto
            - manual
        reviewedAt:
          type: string
          format: date-time
    ActionTask:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - unit
        - dueDate
        - weight
        - progress
        - sourceText
        - lastApprovedUpdateAt
        - submitPeriodKeys
        - pendingSubmissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          oneOf:
            - $ref: '#/components/schemas/UnitSummary'
            - type: 'null'
        dueDate:
          type: [ string, 'null' ]
          format: date
        weight:
          type: number
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Tiến độ của bản đã duyệt mới nhất tính đến cuối kỳ được chọn; 0 nếu chưa có bản đã duyệt
        sourceText:
          type: [ string, 'null' ]
          description: Văn bản gốc từ Excel (trách nhiệm, đầu ra, ngày hoàn thành)
        lastApprovedUpdateAt:
          type: [ string, 'null' ]
          format: date-time
        submitPeriodKeys:
          type: array
          description: Các kỳ quý đang mở mà người đang đăng nhập được nộp tiến độ cho đầu việc này; rỗng là không được nộp
          items:
            type: string
        pendingSubmissions:
          type: array
          description: Bản tiến độ đang chờ duyệt của đầu việc (mọi kỳ); rỗng với vai trò viewer
          items:
            $ref: '#/components/schemas/PendingRef'
    ProfileSummary:
      type: object
      additionalProperties: false
      required:
        - riskCode
        - hsrrCode
        - name
        - riskType
        - riskZone
        - riskGroup
        - owner
        - inherent
        - residual
        - kri
        - kci
        - actions
        - actionProgress
      properties:
        riskCode:
          type: string
        hsrrCode:
          type: string
        name:
          type: string
        riskType:
          type: string
        riskZone:
          type: string
        riskGroup:
          type: string
        owner:
          type: string
        inherent:
          $ref: '#/components/schemas/RiskRating'
        residual:
          description: Mức còn lại mới nhất của kỳ được chọn trở về trước; null nếu Ban 4 chưa nhập
          oneOf:
            - $ref: '#/components/schemas/RiskRating'
            - type: 'null'
        kri:
          $ref: '#/components/schemas/IndicatorZoneCounts'
        kci:
          $ref: '#/components/schemas/IndicatorZoneCounts'
        actions:
          $ref: '#/components/schemas/ActionStatusCounts'
        actionProgress:
          type: [ number, 'null' ]
          description: Trung bình cộng tiến độ các KH của hồ sơ; null nếu hồ sơ không có KH
    Overview:
      type: object
      additionalProperties: false
      required:
        - cycle
        - period
        - hasApprovedData
        - asOfDate
        - profileCount
        - kri
        - kci
        - actions
        - actionProgressAverage
      properties:
        cycle:
          $ref: '#/components/schemas/CycleSummary'
        period:
          oneOf:
            - $ref: '#/components/schemas/PeriodSummary'
            - type: 'null'
        hasApprovedData:
          type: boolean
          description: Có ít nhất một số liệu chỉ số hoặc tiến độ đã duyệt hay chưa
        asOfDate:
          type: [ string, 'null' ]
          format: date
          description: Ngày duyệt gần nhất của số liệu được tính; null nếu chưa có
        profileCount:
          type: integer
          minimum: 0
        kri:
          $ref: '#/components/schemas/IndicatorZoneCounts'
        kci:
          $ref: '#/components/schemas/IndicatorZoneCounts'
        actions:
          $ref: '#/components/schemas/ActionStatusCounts'
        actionProgressAverage:
          type: [ number, 'null' ]
    ScaleLevel:
      type: object
      additionalProperties: false
      required:
        - score
        - label
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
    HeatmapPoint:
      type: object
      additionalProperties: false
      required:
        - riskCode
        - name
        - inherent
        - residual
      properties:
        riskCode:
          type: string
        name:
          type: string
        inherent:
          $ref: '#/components/schemas/RiskRating'
        residual:
          oneOf:
            - $ref: '#/components/schemas/RiskRating'
            - type: 'null'
    Heatmap:
      type: object
      additionalProperties: false
      required:
        - scaleProvisional
        - impactLevels
        - likelihoodLevels
        - points
      properties:
        scaleProvisional:
          type: boolean
          description: true khi thang 5 mức còn là thang tạm (giả định G1); frontend phải hiện ghi chú
        impactLevels:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/ScaleLevel'
        likelihoodLevels:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/ScaleLevel'
        points:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapPoint'
    Cause:
      type: object
      additionalProperties: false
      required:
        - code
        - group
        - description
        - controlCodes
      properties:
        code:
          type: string
        group:
          type: string
        description:
          type: string
        controlCodes:
          type: array
          items:
            type: string
    Impact:
      type: object
      additionalProperties: false
      required:
        - code
        - group
        - description
        - level
      properties:
        code:
          type: string
        group:
          type: string
        description:
          type: string
        level:
          type: string
    Control:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - ownerText
        - frequency
        - objective
        - method
        - designEff
        - operatingEff
        - overallEff
        - needsSupplement
        - causeCodes
        - actionCodes
        - units
      properties:
        code:
          type: string
        description:
          type: string
        ownerText:
          type: string
        frequency:
          type: string
        objective:
          type: string
        method:
          type: string
        designEff:
          type: string
        operatingEff:
          type: string
        overallEff:
          type: string
        needsSupplement:
          type: boolean
        causeCodes:
          type: array
          items:
            type: string
        actionCodes:
          type: array
          items:
            type: string
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitSummary'
    ActionPlan:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - responsibilityText
        - deliverable
        - dueText
        - dueDate
        - controlCodes
        - status
        - progress
        - tasks
      properties:
        code:
          type: string
        description:
          type: string
        responsibilityText:
          type: string
        deliverable:
          type: string
        dueText:
          type: string
        dueDate:
          type: [ string, 'null' ]
          format: date
          description: Hạn muộn nhất trong các đầu việc có hạn; null nếu không đầu việc nào có hạn
        controlCodes:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ActionStatus'
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Trung bình cộng tiến độ các đầu việc, làm tròn 1 chữ số thập phân
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ActionTask'
    IndicatorThresholds:
      type: object
      description: Ba ngưỡng nguyên văn từ Excel
      additionalProperties: false
      required:
        - green
        - yellow
        - red
      properties:
        green:
          type: string
        yellow:
          type: string
        red:
          type: string
    Indicator:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - kind
        - name
        - formula
        - frequency
        - periodKind
        - thresholds
        - mode
        - ownerUnit
        - note
        - current
        - submitPeriodKeys
        - pendingSubmissions
        - unitKind
        - unitLabel
        - direction
        - yellowAt
        - redAt
        - targetValue
        - targetProgress
        - dataSource
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        kind:
          type: string
          enum:
            - kri
            - kci
        name:
          type: string
        formula:
          type: string
        frequency:
          type: string
        periodKind:
          type: string
          enum:
            - month
            - quarter
            - event
        thresholds:
          $ref: '#/components/schemas/IndicatorThresholds'
        mode:
          type: string
          enum:
            - auto
            - manual
          description: auto khi server chấm được vùng (ngưỡng số của admin, hoặc ba chữ ngưỡng phân tích được); manual khi người nhập phải chọn vùng
        ownerUnit:
          oneOf:
            - $ref: '#/components/schemas/UnitSummary'
            - type: 'null'
        note:
          type: [ string, 'null' ]
        current:
          oneOf:
            - $ref: '#/components/schemas/CurrentReading'
            - type: 'null'
        submitPeriodKeys:
          type: array
          description: Các kỳ đang mở, đúng loại kỳ của chỉ số, mà người đang đăng nhập được nộp số liệu; rỗng là không được nộp
          items:
            type: string
        pendingSubmissions:
          type: array
          description: Bản số liệu đang chờ duyệt của chỉ số (mọi kỳ); rỗng với vai trò viewer
          items:
            $ref: '#/components/schemas/PendingRef'
        unitKind:
          type: string
          enum:
            - percent
            - count
